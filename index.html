const coords={'Santiago':[8.10,-80.98],'Soná':[8.01,-81.32],'Atalaya':[8.04,-80.92],'David':[8.43,-82.43],'Boquete':[8.78,-82.44],'Chitré':[7.96,-80.43],'Las Tablas':[7.77,-80.28],'Penonomé':[8.52,-80.36],'Aguadulce':[8.25,-80.55],'Panamá':[8.98,-79.52],'La Chorrera':[8.88,-79.78],'Colón':[9.36,-79.90]};
const species={'Bovinos':['Brahman','Holstein','Gyr','Nelore','Angus','Simmental','Cruce','Otra'],'Porcinos':['Yorkshire','Landrace','Duroc','Pietrain','Cruce','Otra'],'Aves':['Pekín','Ponedora','Broiler','Criolla','Codorniz','Otra'],'Ovinos':['Dorper','Pelibuey','Katahdin','Otra'],'Caprinos':['Boer','Saanen','Alpina','Otra'],'Equinos':['Criollo','Cuarto de milla','Otra'],'Otros':['Otra']};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let user=load('bm_user',null),ads=[],page='home',selected=null,filter={species:'Todos',radius:'100',province:'',district:'',q:'',min:'',max:''};

// Supabase cloud connector. Public publishable key only.
const SB_URL='https://bjucsjedhqiqwhavauni.supabase.co';
const SB_KEY='sb_publishable_8nWmAhWxC6H7ssGGBkNc-w_G4gb7EjB';
let publishing=false;
let session=load('bm_cloud_session',null),cloudBusy=false;
const headers=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+(session?.access_token||SB_KEY),'Content-Type':'application/json'});
async function api(path,options={}){let response=await fetch(SB_URL+path,{...options,headers:{...headers(),...(options.headers||{})}});if(!response.ok){let msg=await response.text();throw Error(msg.slice(0,350))}let txt=await response.text();return txt?JSON.parse(txt):null}
async function loginCloud(allowNew=false){
 if(session?.access_token){
  try{
   const r=await fetch(SB_URL+'/auth/v1/user',{headers:headers()});
   if(r.ok){const profile=await r.json();session.user=profile;save('bm_cloud_session',session);return profile.id}
  }catch(err){throw Error('No hay conexión para verificar tu sesión. Inténtalo nuevamente sin cerrar sesión.')}
  if(!session.refresh_token)throw Error('Tu sesión anterior no puede renovarse. No cierres sesión ni vuelvas a registrarte: conserva tus datos y solicita ayuda para recuperar tus anuncios.');
  const refreshed=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!refreshed.ok)throw Error('No se pudo renovar tu sesión. No cierres sesión ni crees otra cuenta: tus anuncios siguen guardados en Supabase.');
  const next=await refreshed.json();
  if(next.user?.id!==session.user?.id)throw Error('La sesión renovada no corresponde al productor anterior.');
  session=next;save('bm_cloud_session',session);return session.user.id;
 }
 if(user&&!allowNew)throw Error('Hay datos de un productor en este navegador, pero no encontramos su sesión. No crearemos otra cuenta automáticamente para evitar separar sus anuncios.');
 const r=await fetch(SB_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({})});
 if(!r.ok)throw Error('No se pudo iniciar sesión anónima: '+(await r.text()).slice(0,250));
 session=await r.json();save('bm_cloud_session',session);return session.user.id;
}
async function saveProducer(allowNew=false){let id=await loginCloud(allowNew);await api('/rest/v1/productores?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id,nombre:user.name,whatsapp:user.phone,provincia:user.province,distrito:user.district,comunidad:user.community,latitud:position(user.province,user.district)[0],longitud:position(user.province,user.district)[1]})})}
function toAd(p){return {id:p.id,producerId:p.productor_id,owner:p.productores?.nombre||'Productor',phone:p.productores?.whatsapp||'',species:p.especie,breed:p.raza,sex:p.sexo,age:String(p.edad??'')+' '+(p.unidad_edad||''),mode:p.modalidad,quantity:p.cantidad,price:p.precio,priceMode:p.tipo_precio==='Por lote'?'Por lote completo':'Por animal',province:p.provincia,district:p.distrito,community:p.comunidad||'',description:p.descripcion||'',photos:(p.fotos_publicaciones||[]).slice().sort((a,b)=>a.orden-b.orden).map(f=>SB_URL+'/storage/v1/object/public/animales/'+f.ruta_archivo),photo:(p.fotos_publicaciones||[]).length?SB_URL+'/storage/v1/object/public/animales/'+(p.fotos_publicaciones||[]).slice().sort((a,b)=>a.orden-b.orden)[0].ruta_archivo:'',status:p.estado==='vendido'?'sold':'active',created:p.creado_en}}
async function refreshCloud(){
 if(cloudBusy)return;cloudBusy=true;
 try{
  const uid=await loginCloud();
  const rows=await api('/rest/v1/publicaciones?select=*,productores(nombre,whatsapp),fotos_publicaciones(ruta_archivo,orden)&estado=eq.disponible&order=creado_en.desc&limit=300');
  const own=await api('/rest/v1/publicaciones?select=*,productores(nombre,whatsapp),fotos_publicaciones(ruta_archivo,orden)&productor_id=eq.'+encodeURIComponent(uid)+'&order=creado_en.desc&limit=1000');
  const combined=new Map();for(const r of [...(rows||[]),...(own||[])])combined.set(r.id,r);
  ads=[...combined.values()].map(toAd);render();
 }catch(err){console.error(err);showCloudError('No se pudieron cargar los anuncios: '+err.message)}
 finally{cloudBusy=false}
}
function showCloudError(msg){let e=document.getElementById('cloudNotice');if(e){e.textContent=msg;e.hidden=false}else alert(msg)}
async function publishCloud(a,files){let uid=await loginCloud();await saveProducer();let pp={productor_id:uid,titulo:a.species+' '+a.breed,especie:a.species,raza:a.breed,sexo:a.sex,edad:parseFloat(a.age)||0,unidad_edad:a.age.replace(/^[\d., ]+/, '').trim()||'meses',modalidad:a.mode,cantidad:a.quantity,precio:a.price,tipo_precio:a.priceMode==='Por lote completo'?'Por lote':'Por animal',descripcion:a.description,provincia:a.province,distrito:a.district,comunidad:a.community,latitud:position(a.province,a.district)[0],longitud:position(a.province,a.district)[1],estado:'disponible'};
let result=await api('/rest/v1/publicaciones?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(pp)});let id=result[0].id;
for(let i=0;i<files.length;i++){
 const file=files[i],ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const path=uid+'/'+id+'-'+i+'-'+Date.now()+'.'+ext;
 const r=await fetch(SB_URL+'/storage/v1/object/animales/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});
 if(!r.ok)throw Error('El anuncio se creó, pero falló la foto '+(i+1)+': '+(await r.text()).slice(0,200));
 await api('/rest/v1/fotos_publicaciones',{method:'POST',body:JSON.stringify({publicacion_id:id,ruta_archivo:path,orden:i})});
}
await refreshCloud()}
async function preparePhoto(file){
 if(!file.type.startsWith('image/')&&!/\.(heic|heif|jpg|jpeg|png|webp)$/i.test(file.name))throw Error('Selecciona una imagen JPG, PNG, WebP o HEIC.');
 if(file.size<=5*1024*1024&&['image/jpeg','image/png','image/webp'].includes(file.type))return file;
 let bitmap;
 try{bitmap=await createImageBitmap(file)}catch{throw Error('El navegador no pudo abrir esta imagen. Si es HEIC/HEIF, conviértela a JPG o PNG y vuelve a seleccionarla.')}
 let maxSide=1800,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
 let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
 canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
 for(let q of [.85,.72,.6,.45]){
  let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q));
  if(blob&&blob.size<=5*1024*1024)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
 }
 throw Error('Esta foto no se pudo reducir a 5 MB.');
}
function selectedPhotos(){return ['photo1','photo2','photo3'].map(id=>document.getElementById(id)?.files?.[0]).filter(Boolean)}
function galleryImage(src){const img=document.getElementById('galleryMain');if(img){img.src=src;img.onerror=()=>{img.alt='No se pudo cargar esta fotografía';};}document.querySelectorAll('[data-photo]').forEach(b=>b.setAttribute('aria-pressed',String((ads.find(a=>a.id===selected)?.photos||[])[Number(b.dataset.photo)]===src)));}
function changePhotoPreview(){for(let i=1;i<=3;i++){let input=document.getElementById('photo'+i),label=document.getElementById('photoPreview'+i);if(label)label.textContent=input?.files?.[0]?'✓ '+input.files[0].name:'Sin fotografía seleccionada';}}
function position(province,district){return coords[district]||provinces[province]?.[0]||[8.98,-79.52]}function km(a,b){let r=Math.PI/180,dlat=(b[0]-a[0])*r,dlon=(b[1]-a[1])*r,x=Math.sin(dlat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dlon/2)**2;return Math.round(6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))}function opts(items,selected='',blank='Seleccionar'){return `<option value="">${blank}</option>`+items.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}function districts(province){return (provinces[province]||[]).slice(1)}function field(name,label,html){return `<label for="${name}">${label}</label>${html}`};function go(p,id){page=p;selected=id??null;render();window.scrollTo(0,0)}function render(){let app=$('#app');$('#headerLocation').textContent=user?'📍 '+user.district:'🇵🇦';if(!user&&page!=='register')page='register';let html=page==='register'?registration():page==='home'?home():page==='search'?search():page==='publish'?publish():page==='detail'?detail():page==='seller'?seller():page==='mine'?mine():profile();app.innerHTML=html;tabs();bind();}
function registration(){return `<div class="card"><h2>🐄 Crear cuenta</h2><p class="muted">Tus datos se usarán para mostrar animales cercanos y facilitar el contacto.</p><form id="registerForm">${field('name','Nombre completo','<input id="name" required maxlength="80" placeholder="Nombre y apellido">')}${field('phone','WhatsApp (Panamá)','<input id="phone" type="tel" required pattern="[0-9+ ()-]{7,18}" placeholder="6123-4567">')}${field('province','Provincia',`<select id="province" required>${opts(Object.keys(provinces))}</select>`)}${field('district','Distrito','<select id="district" required><option value="">Selecciona provincia primero</option></select>')}${field('community','Corregimiento o comunidad','<input id="community" required maxlength="100" placeholder="Ej. Canto del Llano">')}<p class="notice">La ubicación será aproximada, según tu distrito. No necesitas activar el GPS.</p><button class="btn" style="width:100%">Registrarme</button></form></div>`}
function home(){let visible=getAds();return `<div class="card"><div class="row between"><div><b>📍 ${esc(user.district)}, ${esc(user.province)}</b><div class="muted">Animales cerca de ti</div></div><span class="badge">${filter.radius==='all'?'Panamá':filter.radius+' km'}</span></div><label>Radio de búsqueda</label><select id="radius">${[['25','25 km'],['50','50 km'],['100','100 km'],['all','Todo Panamá']].map(([v,t])=>`<option value="${v}" ${filter.radius===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="chips">${['Todos',...Object.keys(species)].map(s=>`<button class="chip ${filter.species===s?'active':''}" data-cat="${s}">${s}</button>`).join('')}</div>${hasFilters()?`<div class="bm-clear"><span class="muted">Búsqueda filtrada</span><button type="button" class="btn secondary" id="clearFilters">✕ Limpiar filtros y ver todos</button></div>`:``}<div class="row between"><h2>Publicaciones cercanas</h2><button class="btn secondary" data-go="search">🔎 Filtrar</button></div>${cards(visible)}${!ads.length?'<p class="notice">Aún no hay anuncios. Publica el primero para probar BioMarket Panamá.</p>':''}`}
function hasFilters(){return filter.species!=='Todos'||!!filter.province||!!filter.district||!!filter.q||!!filter.min||!!filter.max||filter.radius!=='100'}
function resetFilters(){filter={species:'Todos',radius:'100',province:'',district:'',q:'',min:'',max:''};go('home')}
function getAds(){let origin=position(user.province,user.district);return ads.filter(a=>a.status==='active').map(a=>({...a,distance:km(origin,position(a.province,a.district))})).filter(a=>(filter.species==='Todos'||a.species===filter.species)&&(!filter.province||a.province===filter.province)&&(!filter.district||a.district===filter.district)&&(!filter.q||[a.species,a.breed,a.description,a.district].join(' ').toLowerCase().includes(filter.q.toLowerCase()))&&(!filter.min||a.price>=+filter.min)&&(!filter.max||a.price<=+filter.max)&&(filter.radius==='all'||filter.province||a.distance<=+filter.radius)).sort((a,b)=>a.distance-b.distance)}
function cards(items){return items.length?`<div class="grid">${items.map(a=>`<article class="listing" data-detail="${a.id}">${a.photo?`<img src="${a.photo}" alt="Animal publicado">`:`<div style="height:150px;display:grid;place-items:center;background:#dfeee1;font-size:50px">🐄</div>`}<div class="body"><b>${esc(a.species)} · ${esc(a.breed)}</b><div class="price">$${Number(a.price).toFixed(2)}</div><div class="muted">📍 ${esc(a.district)} · ${a.distance} km</div><div class="muted">${a.quantity>1?a.quantity+' animales':'Individual'}</div></div></article>`).join('')}</div>`:'<div class="empty">🐾<h3>No hay anuncios con estos filtros</h3><p>Prueba ampliar la distancia o seleccionar todo Panamá.</p></div>'}
function search(){return `<h2>🔎 Búsqueda avanzada</h2><div class="card"><label>Buscar por palabra</label><input id="q" value="${esc(filter.q)}" placeholder="Ej. Brahman, patos Pekín"><label>Especie</label><select id="fSpecies">${opts(Object.keys(species),filter.species==='Todos'?'':filter.species,'Todas las especies')}</select><label>Provincia</label><select id="fProvince">${opts(Object.keys(provinces),filter.province,'Todo Panamá')}</select><label>Distrito</label><select id="fDistrict">${opts(districts(filter.province),filter.district,'Todos los distritos')}</select><div class="row"><div style="flex:1"><label>Precio mínimo</label><input id="min" type="number" min="0" value="${esc(filter.min)}"></div><div style="flex:1"><label>Precio máximo</label><input id="max" type="number" min="0" value="${esc(filter.max)}"></div></div><label>Distancia (si no seleccionas provincia)</label><select id="fRadius"><option value="25">25 km</option><option value="50">50 km</option><option value="100">100 km</option><option value="all">Todo Panamá</option></select><button class="btn" id="apply" style="width:100%;margin-top:15px">Ver resultados</button><button type="button" class="btn secondary" id="clearFilters" style="width:100%;margin-top:10px">✕ Limpiar filtros y ver todos</button></div>`}
function publish(){return `<h2>➕ Publicar animales</h2><div class="card"><form id="adForm"><label>Fotografías (hasta 3; máximo 5 MB por foto después de ajustar)</label><div class="photo-slot"><label for="photo1">📷 Foto 1 — Principal</label><input id="photo1" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><p id="photoPreview1" class="muted">Sin fotografía seleccionada</p></div><div class="photo-slot"><label for="photo2">📷 Foto 2 — Opcional</label><input id="photo2" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><p id="photoPreview2" class="muted">Sin fotografía seleccionada</p></div><div class="photo-slot"><label for="photo3">📷 Foto 3 — Opcional</label><input id="photo3" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><p id="photoPreview3" class="muted">Sin fotografía seleccionada</p></div><p class="muted">Puedes adjuntar hasta tres fotos por separado. JPG, JPEG, PNG y WebP. Las fotos grandes se comprimen automáticamente. HEIC/HEIF se intentará convertir si el navegador puede leerlas; si no, conviértelas a JPG desde tu teléfono.</p><label>Especie</label><select id="species" required>${opts(Object.keys(species))}</select><label>Raza</label><select id="breed" required><option value="">Selecciona especie primero</option></select><div class="row"><div style="flex:1"><label>Sexo</label><select id="sex" required><option>Macho</option><option>Hembra</option><option>Mixto</option></select></div><div style="flex:1"><label>Edad</label><input id="age" required placeholder="Ej. 18 meses"></div></div><label>Modalidad</label><select id="mode"><option>Individual</option><option>Lote</option></select><label>Cantidad</label><input id="quantity" type="number" min="1" max="100000" value="1" required><label>Precio en USD</label><input id="price" type="number" min="0" step="0.01" required placeholder="Ej. 850"><label>Precio corresponde a</label><select id="priceMode"><option>Por animal</option><option>Por lote completo</option></select><label>Provincia donde están los animales</label><select id="adProvince" required>${opts(Object.keys(provinces),user.province)}</select><label>Distrito</label><select id="adDistrict" required>${opts(districts(user.province),user.district)}</select><label>Corregimiento o comunidad</label><input id="adCommunity" required value="${esc(user.community)}"><label>Descripción</label><textarea id="description" maxlength="800" placeholder="Estado, peso, características, etc."></textarea><p class="notice">Contacto automático: ${esc(user.name)} · ${esc(user.phone)}</p><button id="publishButton" class="btn" style="width:100%">Publicar gratis</button><p id="publishStatus" class="notice" role="status" aria-live="polite" hidden></p></form></div>`}
function detail(){let a=ads.find(x=>x.id===selected);if(!a)return '<p>Anuncio no encontrado.</p>';let dist=km(position(user.province,user.district),position(a.province,a.district)),wa=(a.phone||'').replace(/\D/g,'');if(wa.length===8)wa='507'+wa;return `<button class="btn secondary" data-go="home">← Volver</button><div class="card">${a.photo?`<div class="bm-thumbs" aria-label="Fotografías del animal">${(a.photos?.length?a.photos:[a.photo]).map((src,i)=>`<button type="button" class="bm-thumb" data-lightbox="${i}" aria-label="Ampliar fotografía ${i+1}"><img src="${esc(src)}" alt="Fotografía ${i+1} del animal" loading="lazy"></button>`).join('')}</div><p class="muted">Toca una fotografía para ampliarla. Desliza para ver las demás.</p>`:'<div class="empty">🐄 Sin fotografía</div>'}<div class="row between"><h2>${esc(a.species)} · ${esc(a.breed)}</h2><span class="badge">${dist} km</span></div><div class="price">$${Number(a.price).toFixed(2)} <span class="muted">${esc(a.priceMode)}</span></div><p>Sexo: <b>${esc(a.sex)}</b><br>Edad: <b>${esc(a.age)}</b><br>Modalidad: <b>${esc(a.mode)}</b><br>Cantidad: <b>${a.quantity}</b><br>Ubicación: <b>${esc(a.community)}, ${esc(a.district)}, ${esc(a.province)}</b></p><p>${esc(a.description||'Sin descripción adicional.')}</p><hr><p>👤 <b>${esc(a.owner)}</b></p><button class="btn secondary" id="seller">Ver ficha del vendedor</button> <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hola, vi tu anuncio de '+a.species+' '+a.breed+' en BioMarket Panamá. ¿Sigue disponible?')}">💬 WhatsApp</a></div>`}
function seller(){let a=ads.find(x=>x.id===selected);if(!a)return '<p>Vendedor no encontrado</p>';let own=ads.filter(x=>x.phone===a.phone&&x.status==='active');return `<button class="btn secondary" data-detail="${a.id}">← Volver al anuncio</button><div class="card"><h2>👤 ${esc(a.owner)}</h2><p>📍 ${esc(a.district)}, ${esc(a.province)}</p><p>${own.length} anuncios activos</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${(a.phone||'').replace(/\D/g,'').replace(/^(?=\d{8}$)/,'507')}">💬 Contactar por WhatsApp</a></div><h3>Otros anuncios del vendedor</h3>${cards(own.map(x=>({...x,distance:km(position(user.province,user.district),position(x.province,x.district))})))}`}
function mine(){let own=ads.filter(a=>a.producerId===session?.user?.id),active=own.filter(a=>a.status==='active');return `<h2>📋 Mis publicaciones</h2><div class="stats"><div><strong>${own.length}</strong><span class="small">Total</span></div><div><strong>${active.length}</strong><span class="small">Activos</span></div><div><strong>${own.length-active.length}</strong><span class="small">Vendidos</span></div></div>${own.length?own.map(a=>`<div class="card"><div class="bm-my-item"><button type="button" class="bm-my-photo" data-detail="${a.id}" aria-label="Ver fotos del anuncio">${a.photo?`<img src="${esc(a.photo)}" alt="Foto de ${esc(a.species)} ${esc(a.breed)}" loading="lazy">`:`<span aria-hidden="true">🐄</span>`}</button><div class="bm-my-info"><b>${esc(a.species)} · ${esc(a.breed)}</b><div class="muted">$${Number(a.price).toFixed(2)} · ${esc(a.district)}</div><div class="muted">${a.quantity>1?a.quantity+' animales':'Individual'}</div><span class="badge">${a.status==='active'?'Disponible':'Vendido'}</span></div><button class="btn secondary" data-detail="${a.id}">Ver</button></div><div class="row" style="margin-top:12px">${a.status==='active'?`<button class="btn" data-sold="${a.id}">Marcar vendido</button>`:''}<button class="btn outline" data-delete="${a.id}">Eliminar</button></div></div>`).join(''):'<div class="empty">Todavía no has publicado animales.</div>'}`}

function profile(){return `<h2>👤 Mi cuenta</h2><div class="card"><h3>${esc(user.name)}</h3><p>💬 ${esc(user.phone)}<br>📍 ${esc(user.community)}, ${esc(user.district)}, ${esc(user.province)}</p><button class="btn secondary" id="edit">Editar mis datos</button> <button class="btn outline" id="logout" style="margin-top:8px">Cerrar sesión</button><p class="muted">Atención: este acceso sin correo ni contraseña no se puede recuperar solo con tu número de WhatsApp. No cierres sesión si necesitas conservar el control de tus anuncios.</p></div><div class="card"><h3>📊 Mis estadísticas</h3><p>Anuncios publicados: ${ads.filter(a=>a.producerId===session?.user?.id).length}</p><p>Animales vendidos (anuncios): ${ads.filter(a=>a.producerId===session?.user?.id&&a.status==='sold').length}</p><button class="btn" data-go="mine">Administrar publicaciones</button></div><div class="notice">Versión de prueba conectada a Supabase. Los anuncios se comparten entre dispositivos con internet.</div>`}
function tabs(){let items=[['home','⌂','Inicio'],['search','⌕','Buscar'],['publish','⊕','Publicar'],['mine','▤','Mis anuncios'],['profile','♙','Mi cuenta']];$('#tabs').innerHTML=user?items.map(([p,i,t])=>`<button class="${page===p?'active':''}" data-go="${p}"><span>${i}</span>${t}</button>`).join(''):''}
function bind(){if($('#clearFilters'))$('#clearFilters').onclick=resetFilters;document.querySelectorAll('[data-lightbox]').forEach(b=>b.onclick=()=>openLightbox(Number(b.dataset.lightbox)));document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-detail]').forEach(e=>e.onclick=()=>go('detail',e.dataset.detail));document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{filter.species=e.dataset.cat;render()});if($('#radius'))$('#radius').onchange=e=>{filter.radius=e.target.value;render()};function dependent(p,d){if($(p))$(p).onchange=()=>{$(d).innerHTML=opts(districts($(p).value))}}dependent('#province','#district');dependent('#adProvince','#adDistrict');dependent('#fProvince','#fDistrict');document.querySelectorAll('[data-photo]').forEach(e=>e.onclick=()=>{let a=ads.find(x=>x.id===selected);if(a?.photos?.[+e.dataset.photo])galleryImage(a.photos[+e.dataset.photo])});['photo1','photo2','photo3'].forEach(id=>{if($('#'+id))$('#'+id).onchange=changePhotoPreview});if($('#species'))$('#species').onchange=()=>$('#breed').innerHTML=opts(species[$('#species').value]||[]);if($('#registerForm'))$('#registerForm').onsubmit=async e=>{e.preventDefault();user={name:$('#name').value.trim(),phone:$('#phone').value.trim(),province:$('#province').value,district:$('#district').value,community:$('#community').value.trim()};save('bm_user',user);try{await saveProducer(true);go('home');await refreshCloud()}catch(err){alert('No se pudo registrar en la nube: '+err.message)}};if($('#fRadius'))$('#fRadius').value=filter.radius;if($('#apply'))$('#apply').onclick=()=>{filter={species:$('#fSpecies').value||'Todos',province:$('#fProvince').value,district:$('#fDistrict').value,q:$('#q').value.trim(),min:$('#min').value,max:$('#max').value,radius:$('#fRadius').value};go('home')};if($('#adForm'))$('#adForm').onsubmit=async e=>{e.preventDefault();if(publishing)return;let chosen=selectedPhotos(),photo='';if(chosen.length>3){alert('Puedes seleccionar hasta 3 fotografías.');return}publishing=true;let btn=$('#publishButton'),status=$('#publishStatus');btn.disabled=true;btn.textContent='Publicando…';status.hidden=false;status.textContent='Espera, estamos publicando tu anuncio. No vuelvas a pulsar el botón.';let a={id:Date.now(),owner:user.name,phone:user.phone,species:$('#species').value,breed:$('#breed').value,sex:$('#sex').value,age:$('#age').value,mode:$('#mode').value,quantity:+$('#quantity').value,price:+$('#price').value,priceMode:$('#priceMode').value,province:$('#adProvince').value,district:$('#adDistrict').value,community:$('#adCommunity').value.trim(),description:$('#description').value.trim(),photo,status:'active',created:new Date().toISOString()};try{let files=[];for(let i=0;i<chosen.length;i++){status.textContent='Preparando fotografía '+(i+1)+' de '+chosen.length+'…';files.push(await preparePhoto(chosen[i]))}status.textContent='Espera, estamos publicando tu anuncio y subiendo las fotos…';await publishCloud(a,files);go('mine')}catch(err){alert('Error al publicar: '+err.message)}finally{publishing=false;if(btn.isConnected){btn.disabled=false;btn.textContent='Publicar gratis';status.hidden=true}} };document.querySelectorAll('[data-sold]').forEach(e=>e.onclick=async()=>{if(confirm('¿Marcar este anuncio como vendido?'))await changeCloud(e.dataset.sold,'sold')});document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=async()=>{if(confirm('¿Eliminar definitivamente este anuncio?'))await changeCloud(e.dataset.delete,'delete')});if($('#seller'))$('#seller').onclick=()=>go('seller',selected);if($('#edit'))$('#edit').onclick=()=>{const nombre=prompt('Nombre completo:',user.name);if(nombre===null)return;const telefono=prompt('WhatsApp:',user.phone);if(telefono===null)return;if(!nombre.trim()||!telefono.trim()){alert('Nombre y WhatsApp son obligatorios.');return}const oldUser={...user};user={...user,name:nombre.trim(),phone:telefono.trim()};save('bm_user',user);saveProducer().then(()=>go('profile')).catch(err=>{user=oldUser;save('bm_user',user);alert('No se pudieron guardar los cambios: '+err.message)})};if($('#logout'))$('#logout').onclick=()=>{if(!confirm('¿Cerrar sesión? Esta cuenta no tiene correo ni contraseña. Si sales, podrías perder el acceso a tus anuncios anteriores y no podrás recuperarlos solo con tu WhatsApp. ¿Deseas continuar?'))return;session=null;user=null;ads=[];localStorage.removeItem('bm_cloud_session');localStorage.removeItem('bm_user');go('register')}}
render();if(user)refreshCloud();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js?v=20261115").catch(()=>{});

let lightboxIndex=0,lightboxPhotos=[],lightboxStartX=null;
function closeLightbox(){let el=document.getElementById('bmLightbox');if(el)el.hidden=true;document.body.style.overflow=''}
function showLightbox(){let el=document.getElementById('bmLightbox');if(!el||!lightboxPhotos.length)return;el.querySelector('img').src=lightboxPhotos[lightboxIndex];el.querySelector('.bm-count').textContent=(lightboxIndex+1)+' / '+lightboxPhotos.length;el.querySelector('.bm-prev').hidden=lightboxPhotos.length<2;el.querySelector('.bm-next').hidden=lightboxPhotos.length<2}
function moveLightbox(delta){if(!lightboxPhotos.length)return;lightboxIndex=(lightboxIndex+delta+lightboxPhotos.length)%lightboxPhotos.length;showLightbox()}
function openLightbox(i){let a=ads.find(x=>x.id===selected);lightboxPhotos=a?.photos?.length?a.photos:(a?.photo?[a.photo]:[]);if(!lightboxPhotos.length)return;lightboxIndex=Math.max(0,Math.min(i,lightboxPhotos.length-1));let el=document.getElementById('bmLightbox');el.hidden=false;document.body.style.overflow='hidden';showLightbox();el.querySelector('.bm-close').focus()}
function initLightbox(){let el=document.createElement('div');el.id='bmLightbox';el.className='bm-lightbox';el.hidden=true;el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Galería de fotografías');el.innerHTML='<button type="button" class="bm-close" aria-label="Cerrar">×</button><button type="button" class="bm-prev" aria-label="Foto anterior">‹</button><img alt="Fotografía ampliada"><button type="button" class="bm-next" aria-label="Foto siguiente">›</button><span class="bm-count" aria-live="polite"></span>';document.body.appendChild(el);el.querySelector('.bm-close').onclick=closeLightbox;el.querySelector('.bm-prev').onclick=()=>moveLightbox(-1);el.querySelector('.bm-next').onclick=()=>moveLightbox(1);el.onclick=e=>{if(e.target===el)closeLightbox()};el.addEventListener('touchstart',e=>{lightboxStartX=e.changedTouches[0]?.clientX??null},{passive:true});el.addEventListener('touchend',e=>{if(lightboxStartX===null)return;let delta=(e.changedTouches[0]?.clientX??lightboxStartX)-lightboxStartX;if(Math.abs(delta)>45)moveLightbox(delta<0?1:-1);lightboxStartX=null},{passive:true});document.addEventListener('keydown',e=>{if(el.hidden)return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')moveLightbox(-1);if(e.key==='ArrowRight')moveLightbox(1)})}
initLightbox();
</script></body></html>
